name: Update CISA KEV catalog

on:
  schedule:
    - cron: '0 3 * * *'      # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the KEV catalog
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -o known_exploited_vulnerabilities.json \
            https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

      - name: Sanity-check, then build a slim index
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('known_exploited_vulnerabilities.json'))
          vulns = d.get('vulnerabilities', [])
          if len(vulns) < 1000:
              sys.exit('Too few entries - refusing to overwrite the good copy')

          rows = sorted(
              '|'.join([
                  v.get('cveID', ''),
                  v.get('dateAdded', ''),
                  v.get('dueDate', ''),
                  v.get('vendorProject', ''),
                  v.get('product', ''),
              ])
              for v in vulns
          )

          with open('kev-index.txt', 'w') as f:
              f.write(f"# CISA KEV index | catalogVersion {d.get('catalogVersion')} "
                      f"| dateReleased {d.get('dateReleased')} | {len(rows)} entries\n")
              f.write("# cveID|dateAdded|dueDate|vendorProject|product\n")
              f.write('\n'.join(rows) + '\n')

          print(f"catalogVersion {d.get('catalogVersion')} - {len(rows)} entries indexed")
          PY

      - name: Commit only if something changed
        run: |
          git config user.name  'kev-bot'
          git config user.email 'kev-bot@users.noreply.github.com'
          git add known_exploited_vulnerabilities.json kev-index.txt
          git diff --staged --quiet && echo 'No change today' && exit 0
          git commit -m "KEV catalog $(date -u +%Y-%m-%d)"
          git push
