name: Update Broadcom advisory index

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the advisory list and build the index
        run: |
          python3 - <<'PY'
          import json, sys, os, time, math, datetime, urllib.request, collections

          URL = ("https://support.broadcom.com/web/ecx/security-advisory"
                 "/-/securityadvisory/getSecurityAdvisoryList")
          KEEP = ("VCDSA", "SYMSA", "ESDSA", "VTDSA")   # MFDSA (mainframe) deliberately excluded
          WINDOW_DAYS = 7
          PAGE_SIZE = 100
          MAX_PAGES = 400
          MAX_SWEEPS = 3
          COMPLETENESS = 0.995      # measured on ROWS RECEIVED, not unique IDs
          LATEST_PER_PREFIX = 8
          UA = "OneAdvanced-ITO-SOC-advisory-collector/1.0 (daily security advisory check)"

          def fetch(page):
              body = json.dumps({"bu": "", "pageNumber": page, "pageSize": PAGE_SIZE}).encode()
              req = urllib.request.Request(URL, data=body, method="POST")
              req.add_header("Content-Type", "application/json")
              req.add_header("User-Agent", UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def fetch_retry(page, attempts=3):
              for n in range(attempts):
                  try:
                      return fetch(page)
                  except Exception as e:
                      if n == attempts - 1:
                          raise
                      print(f"page {page} attempt {n+1} failed ({e}) - retrying")
                      time.sleep(5 * (n + 1))

          # --- collect the catalogue -------------------------------------------
          # Two different numbers matter and must not be confused:
          #   rows_seen  - how many records the server actually handed over.
          #                This is what says whether we read the whole catalogue.
          #   len(records) - unique documentIds after de-duplication. Lower than
          #                rows_seen when the catalogue lists one advisory twice
          #                (e.g. under two business units). A gap here is normal
          #                and is NOT evidence of anything missing.
          records, total, served = {}, None, None
          rows_seen, sweeps_run, pages_total = 0, 0, 0

          for sweep in range(1, MAX_SWEEPS + 1):
              sweeps_run = sweep
              sweep_rows, before = 0, len(records)
              page = 1
              while page <= MAX_PAGES:
                  payload = fetch_retry(page)
                  if not payload.get("success"):
                      sys.exit(f"Endpoint returned success=false on page {page} "
                               "- refusing to overwrite the good copy")
                  data = payload.get("data", {}) or {}
                  rows = data.get("list", []) or []
                  info = data.get("pageInfo", {}) or {}
                  if total is None:
                      total = info.get("totalCount")
                  if served is None:
                      served = len(rows) or PAGE_SIZE
                      print(f"asked {PAGE_SIZE}/page, served {served}/page, totalCount {total}")
                  sweep_rows += len(rows)
                  for r in rows:
                      doc = (r.get("documentId") or "").strip()
                      if doc:
                          records[doc] = r
                  pages_total += 1
                  if not rows:
                      break
                  if total and sweep_rows >= total:
                      break
                  if total and page >= math.ceil(total / served) + 2:
                      break
                  page += 1
                  time.sleep(0.5)

              rows_seen = max(rows_seen, sweep_rows)
              print(f"sweep {sweep}: {sweep_rows} rows received, "
                    f"{len(records) - before} new unique | holding {len(records)} unique")
              # Only sweep again if the server genuinely short-changed us.
              if total and sweep_rows >= total * COMPLETENESS:
                  break
              if len(records) == before and sweep > 1:
                  break

          dupes = rows_seen - len(records)
          print(f"sweeps: {sweeps_run} | pages: {pages_total} | rows received: {rows_seen} "
                f"| unique: {len(records)} | duplicate IDs collapsed: {dupes} "
                f"| catalogue total: {total}")

          # --- sanity checks ---------------------------------------------------
          # Gate on rows RECEIVED. Under-reading looks exactly like a quiet week
          # and must fail loudly; duplicate IDs are harmless and must not.
          if total is None or total < 1000:
              sys.exit(f"Implausible totalCount ({total}) - refusing to overwrite the good copy")
          if rows_seen < total * COMPLETENESS:
              sys.exit(f"Server returned only {rows_seen} of {total} rows after {sweeps_run} "
                       "sweep(s) - incomplete, refusing to overwrite the good copy")

          # --- shape the data ---------------------------------------------------
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          cutoff = now - datetime.timedelta(days=WINDOW_DAYS)

          def parsed(r):
              raw = (r.get("updated") or "").strip()
              if not raw:
                  return None
              try:
                  dt = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if dt.tzinfo is not None:
                  dt = dt.astimezone(datetime.timezone.utc).replace(tzinfo=None)
              return dt

          def clean(s):
              return (s or "").replace("|", "/").replace("\n", " ").replace("\r", " ").strip()

          def row(when, doc, r):
              return "|".join([
                  doc, when.strftime("%Y-%m-%d"), clean(r.get("severity")),
                  clean(r.get("status")), clean(r.get("affectedCve")) or "none listed",
                  clean(r.get("title")), clean(r.get("notificationUrl")),
              ])

          undated, kept = 0, []
          for doc, r in records.items():
              if not doc.startswith(KEEP):
                  continue
              when = parsed(r)
              if when is None:
                  undated += 1
                  continue
              kept.append((when, doc, r))

          kept.sort(key=lambda t: t[0], reverse=True)
          recent = [t for t in kept if t[0] >= cutoff]

          # per-prefix health: one noisy prefix must never mask a quiet one
          by_prefix = collections.defaultdict(list)
          for t in kept:
              by_prefix[t[1][:5]].append(t)
          health = " | ".join(
              f"{p}: {len(by_prefix[p])} total, newest {by_prefix[p][0][0]:%Y-%m-%d}"
              for p in KEEP if by_prefix.get(p)
          ) or "no in-scope advisories found"
          print(health)

          os.makedirs("broadcom", exist_ok=True)
          fetched = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          stamp = (f"# Broadcom security advisories | fetched {fetched} "
                   f"| received {rows_seen} of {total} rows over {pages_total} pages "
                   f"({served}/page), {len(records)} unique after collapsing {dupes} duplicate IDs "
                   f"| prefixes {'+'.join(KEEP)} (MFDSA mainframe excluded)\n")
          health_line = f"# per prefix - {health}\n"
          cols = "# documentId|updated|severity|status|cves|title|url\n"

          # recent.txt - the working file: what changed in the window
          with open("broadcom/recent.txt", "w") as f:
              f.write(stamp)
              f.write(f"# {len(recent)} in-scope advisories updated in the last {WINDOW_DAYS} days "
                      f"| {undated} skipped with an unparseable date\n")
              f.write(health_line)
              f.write(cols)
              for when, doc, r in recent:
                  f.write(row(when, doc, r) + "\n")

          # latest.txt - the canary: newest few PER PREFIX, ignoring the window, so
          # an empty recent.txt can always be told apart from a broken collector.
          with open("broadcom/latest.txt", "w") as f:
              f.write(stamp)
              f.write(f"# the {LATEST_PER_PREFIX} most recent advisories per prefix, ignoring "
                      "the window - diagnostic only, NOT a to-do list\n")
              f.write(health_line)
              f.write(cols)
              for p in KEEP:
                  for when, doc, r in by_prefix.get(p, [])[:LATEST_PER_PREFIX]:
                      f.write(row(when, doc, r) + "\n")

          print(f"wrote recent.txt ({len(recent)} rows) and latest.txt")
          PY

      - name: Commit only if something changed
        run: |
          git config user.name  'advisory-bot'
          git config user.email 'advisory-bot@users.noreply.github.com'
          git add -A broadcom
          git diff --staged --quiet && echo 'No change today' && exit 0
          git commit -m "Broadcom advisory index $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
