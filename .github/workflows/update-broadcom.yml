name: Update Broadcom advisory index

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the advisory list and build the index
        run: |
          python3 - <<'PY'
          import json, sys, os, time, datetime, urllib.request

          URL = ("https://support.broadcom.com/web/ecx/security-advisory"
                 "/-/securityadvisory/getSecurityAdvisoryList")
          KEEP = ("VCDSA", "SYMSA", "ESDSA", "VTDSA")   # MFDSA (mainframe) deliberately excluded
          WINDOW_DAYS = 7
          PAGE_SIZE = 100
          MAX_PAGES = 400          # enough even if the server ignores PAGE_SIZE and serves 20
          LATEST_N = 25
          UA = "OneAdvanced-ITO-SOC-advisory-collector/1.0 (daily security advisory check)"

          def fetch(page):
              body = json.dumps({"bu": "", "pageNumber": page, "pageSize": PAGE_SIZE}).encode()
              req = urllib.request.Request(URL, data=body, method="POST")
              req.add_header("Content-Type", "application/json")
              req.add_header("User-Agent", UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def fetch_retry(page, attempts=3):
              for n in range(attempts):
                  try:
                      return fetch(page)
                  except Exception as e:
                      if n == attempts - 1:
                          raise
                      print(f"page {page} attempt {n+1} failed ({e}) - retrying")
                      time.sleep(5 * (n + 1))

          # --- page through the whole catalogue -------------------------------
          # Ordering is UNSORTED and shifts with pageSize, so page 1 is NOT the
          # newest. Read everything, then filter on `updated` locally. Stop when
          # we hold totalCount records rather than trusting lastPage, because the
          # server may not honour the pageSize we asked for.
          records, total, page, served = {}, None, 1, None
          while page <= MAX_PAGES:
              payload = fetch_retry(page)
              if not payload.get("success"):
                  sys.exit(f"Endpoint returned success=false on page {page} - refusing to overwrite")
              data = payload.get("data", {}) or {}
              rows = data.get("list", []) or []
              info = data.get("pageInfo", {}) or {}
              if total is None:
                  total = info.get("totalCount")
              if served is None:
                  served = len(rows)
                  print(f"asked for {PAGE_SIZE} per page, server served {served}; totalCount {total}")
              before = len(records)
              for r in rows:
                  doc = (r.get("documentId") or "").strip()
                  if doc:
                      records[doc] = r          # de-duplicate across pages
              if not rows:
                  break
              if total and len(records) >= total:
                  break
              if len(records) == before:
                  print(f"page {page} added nothing new - stopping")
                  break
              page += 1
              time.sleep(1)                      # be a polite client

          pages_read = page
          print(f"pages read: {pages_read} | unique records: {len(records)} | catalogue total: {total}")

          # --- sanity checks ---------------------------------------------------
          # A broken, reshaped or partially-read catalogue must NOT silently
          # replace a good index. Under-reading is the dangerous case: it looks
          # like a quiet week.
          if total is None or total < 1000:
              sys.exit(f"Implausible totalCount ({total}) - refusing to overwrite the good copy")
          if len(records) < total * 0.95:
              sys.exit(f"Only read {len(records)} of {total} advisories - incomplete, "
                       "refusing to overwrite the good copy")

          # --- shape the data ---------------------------------------------------
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          cutoff = now - datetime.timedelta(days=WINDOW_DAYS)

          def parsed(r):
              raw = (r.get("updated") or "").strip()
              if not raw:
                  return None
              try:
                  dt = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if dt.tzinfo is not None:
                  dt = dt.astimezone(datetime.timezone.utc).replace(tzinfo=None)
              return dt

          def clean(s):
              return (s or "").replace("|", "/").replace("\n", " ").replace("\r", " ").strip()

          def row(when, doc, r):
              return "|".join([
                  doc,
                  when.strftime("%Y-%m-%d"),
                  clean(r.get("severity")),
                  clean(r.get("status")),
                  clean(r.get("affectedCve")) or "none listed",
                  clean(r.get("title")),
                  clean(r.get("notificationUrl")),
              ])

          undated, kept = 0, []
          for doc, r in records.items():
              if not doc.startswith(KEEP):
                  continue
              when = parsed(r)
              if when is None:
                  undated += 1
                  continue
              kept.append((when, doc, r))

          kept.sort(key=lambda t: t[0], reverse=True)
          recent = [t for t in kept if t[0] >= cutoff]
          newest = kept[0][0].strftime("%Y-%m-%d") if kept else "none"

          print(f"in-scope advisories: {len(kept)} | newest {newest} | "
                f"in {WINDOW_DAYS}-day window: {len(recent)} | undated: {undated}")

          os.makedirs("broadcom", exist_ok=True)
          fetched = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          stamp = (f"# Broadcom security advisories | fetched {fetched} "
                   f"| read {len(records)} of {total} in catalogue over {pages_read} pages "
                   f"({served} served per page) "
                   f"| prefixes {'+'.join(KEEP)} (MFDSA mainframe excluded)\n")
          cols = "# documentId|updated|severity|status|cves|title|url\n"

          # recent.txt — the working file: what changed in the window
          with open("broadcom/recent.txt", "w") as f:
              f.write(stamp)
              f.write(f"# {len(recent)} in-scope advisories updated in the last {WINDOW_DAYS} days "
                      f"| newest in-scope advisory overall is {newest} "
                      f"| {undated} skipped with an unparseable date\n")
              f.write(cols)
              for when, doc, r in recent:
                  f.write(row(when, doc, r) + "\n")

          # latest.txt — the canary: the N most recent regardless of window, so an
          # empty recent.txt can always be told apart from a broken collector.
          with open("broadcom/latest.txt", "w") as f:
              f.write(stamp)
              f.write(f"# the {LATEST_N} most recently updated in-scope advisories, "
                      "ignoring the window - diagnostic only, NOT a to-do list\n")
              f.write(cols)
              for when, doc, r in kept[:LATEST_N]:
                  f.write(row(when, doc, r) + "\n")

          print(f"wrote broadcom/recent.txt ({len(recent)} rows) and "
                f"broadcom/latest.txt ({min(LATEST_N, len(kept))} rows)")
          for when, doc, r in kept[:10]:
              print(f"  {doc} {when:%Y-%m-%d} {r.get('severity')} {clean(r.get('title'))[:70]}")
          PY

      - name: Commit only if something changed
        run: |
          git config user.name  'advisory-bot'
          git config user.email 'advisory-bot@users.noreply.github.com'
          git add -A broadcom
          git diff --staged --quiet && echo 'No change today' && exit 0
          git commit -m "Broadcom advisory index $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
